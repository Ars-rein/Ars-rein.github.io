<style>
:root{
  --bg:#f3f0e8; --surface:#fffdf8; --surface2:#f8f5ee; --ink:#1c1a17; --muted:#6d685e; --line:#e2dccf;
  --accent:#2e5e4e; --accent-ink:#ffffff; --accent-soft:#dfeae4; --brass:#9a6f28; --danger:#b3412e; --danger-soft:#f6e1dc;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --radius:14px; --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141311; --surface:#1e1c19; --surface2:#25221e; --ink:#eee9df; --muted:#a39d91; --line:#34302a;
    --accent:#7dbca3; --accent-ink:#0e1a15; --accent-soft:#233a31; --brass:#d3a95a; --danger:#e07a64; --danger-soft:#3a2420;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1e1c19; --surface2:#25221e; --ink:#eee9df; --muted:#a39d91; --line:#34302a;
  --accent:#7dbca3; --accent-ink:#0e1a15; --accent-soft:#233a31; --brass:#d3a95a; --danger:#e07a64; --danger-soft:#3a2420;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
body{min-height:100vh;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font:600 22px/1.15 var(--serif);margin:0;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .titles{flex:1;min-width:0}
.top .titles h1{font-size:19px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:22px;height:22px}

.wrap{padding:4px 16px 16px}
.section-title{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}

.top .brandlogo{height:46px;width:auto;flex:none;margin-right:4px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3))}
/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seed{width:28px;text-align:right;color:var(--muted);font-size:13px;flex:none}
.pts{font-weight:650;min-width:30px;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);vertical-align:1px}
.tag.warn{background:var(--danger-soft);color:var(--danger);border-color:transparent}

.tcard{display:block;width:100%;text-align:left;padding:16px;margin-bottom:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:18px;height:18px}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 12px}
.toolbar .grow{flex:1;min-width:0}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(88px + env(safe-area-inset-bottom));z-index:15;height:52px;padding:0 20px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.home .fab{bottom:calc(20px + env(safe-area-inset-bottom))}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{

input:disabled{opacity:.7;background:var(--surface2)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--muted);margin:4px 2px 0}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;height:34px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.mini button{height:28px;font-size:12px;padding:0 7px}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on svg{background:var(--accent-soft);border-radius:10px;width:48px;padding:0 12px;box-sizing:border-box}

/* rounds */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;min-width:44px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13.5px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--accent);margin-left:6px;vertical-align:2px}
.chip.on.done::after{background:var(--bg)}

.rhead{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.rhead h2{margin:0;font:600 20px/1.2 var(--serif);flex:1}
.rhead .meta{font-size:13px;color:var(--muted)}

.board{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 12px 10px 8px;border-top:1px solid var(--line)}
.board:first-child{border-top:0}
.bno{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.pl{display:flex;align-items:center;gap:8px;min-width:0;padding:2px 0}
.pl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:560;min-width:0}
.pl .sc{font-size:12px;color:var(--muted);flex:none;margin-left:auto;padding-left:6px}
.pc{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font:800 10px/1 var(--sans);vertical-align:-3px;box-sizing:border-box}
.pc.w{background:#fbf8f1;color:#1c1a17;border:1.5px solid #9d968a}
.pc.w::after{content:"W"}
.pc.b{background:#1c1a17;color:#fbf8f1;border:1.5px solid #1c1a17}
.pc.b::after{content:"B"}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pc.b{border-color:#77705f}}
:root[data-theme="dark"] .pc.b{border-color:#77705f}
.res{min-width:70px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:15px}
.res.pending{color:var(--accent);border:1.5px dashed var(--accent);background:transparent;font-weight:600;font-size:13px}
.res.win-w,.res.win-b,.res.draw{background:var(--accent-soft);border-color:transparent;color:var(--ink)}

.pl.won .nm{font-weight:750}
.pl.lost .nm{color:var(--muted)}
.byeline{color:var(--muted);font-size:13px}
.note{padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:13px;color:var(--muted);margin:10px 0}
.note.warn{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:52px;line-height:1;margin-bottom:10px;color:var(--ink);opacity:.85}

/* edit pairings */
.eboard{padding:10px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center}
.eboard:first-child{border-top:0}
.eboard .sels{display:grid;gap:6px}
.eboard .sels label{display:flex;align-items:center;gap:8px}
.eboard select{height:40px}
.eboard .acts{display:flex;flex-direction:column;gap:6px}

/* tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);-webkit-overflow-scrolling:touch}
table.st{border-collapse:collapse;width:100%;font-size:14px}
table.st th,table.st td{padding:9px 8px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
table.st thead th{border-top:0;font-size:11.5px;font-weight:650;color:var(--muted);letter-spacing:.03em;background:var(--surface2);position:sticky;top:0}
table.st th.l,table.st td.l{text-align:left}
table.st td.nm{max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:560}

table.st tr.top3 td:first-child{color:var(--brass);font-weight:750}
table.st .stick{position:sticky;left:0;background:var(--surface);z-index:1}
table.st thead .stick{background:var(--surface2);z-index:2}
table.st td.x{font-size:12.5px;color:var(--muted)}
table.st td.x b{color:var(--ink);font-weight:650}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(15,12,8,.42);z-index:50;opacity:0;transition:opacity .18s}
.overlay.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.sheet header{display:flex;align-items:center;gap:8px;padding:6px 12px 8px 18px}

.sheet .body{overflow-y:auto;padding:4px 18px 16px}
.sheet footer{display:flex;gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet footer .btn{flex:1}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-40%);opacity:0;transition:all .2s}.sheet.show{transform:translateY(-50%);opacity:1}.sheet .grab{display:none}}

.resgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}

.resgrid button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.resgrid.small button{height:46px;font-size:15px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:4px 0 10px;text-align:center}
.vs .p{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis}
.vs .p small{display:block;color:var(--muted);font-weight:400}

.tbitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.tbitem:first-child{border-top:0}
.tbitem .nm{flex:1}
.tbitem .nm small{color:var(--muted);margin-left:4px}
.tbitem input{width:20px;height:20px;accent-color:var(--accent)}

.statusrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}

.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-weight:560}

.menu-item .d{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.menu-item.danger{color:var(--danger)}

.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:560;z-index:90;opacity:0;transition:all .2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(15,12,8,.45)}
.dialog .box{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}

.dialog p{margin:0 0 16px;color:var(--muted)}

/* team matches */
.res small.rsub{display:block;font-size:10.5px;font-weight:600;color:var(--muted);line-height:1}
span.res{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 12px}

.mscore{font:700 26px/1 var(--serif);padding:8px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;display:flex;gap:8px}
.mscore span{color:var(--muted);font-weight:400}
.mprog{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.mprog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.bcards{display:flex;flex-direction:column;gap:10px}
.bcard{border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px;background:var(--surface)}
.bcard.done{background:var(--surface2)}
.bc-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.bc-no{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bc-res{font-size:12px;font-weight:700;color:var(--accent)}
.bc-wait{font-size:12px;color:var(--muted)}
.bc-players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-bottom:10px}
.bc-vs{font-size:11px;color:var(--muted)}
.pk{position:relative;display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:10px;border:1px solid transparent}
.pk:focus-within{border-color:var(--accent)}
.pk:active{background:var(--line)}
.pk.right{flex-direction:row-reverse;text-align:right}
.pk-txt{display:flex;flex-direction:column;min-width:0}
.pk-name{font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.pk-name i{color:var(--danger);font-style:normal}
.pk-meta{font-size:11.5px;color:var(--muted)}
.pk.won .pk-name{font-weight:800}
.pk.lost .pk-name{color:var(--muted);font-weight:500}
.pk-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.rbar{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px}
.rbar.ff{grid-template-columns:1fr 1fr 1fr;margin-top:6px}
.rb{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink);padding:0 6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb.more{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 10px}
.rbar.ff .rb{font-size:12px;font-weight:600;height:38px;padding:0 4px}
.rb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rb.more.on{background:var(--danger-soft);border-color:transparent;color:var(--danger)}

#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,nav.tabs,.overlay,.sheet,.toast,.dialog{display:none!important}
  #print{display:block;font:11pt/1.35 Georgia,serif;color:#000}
  #print h1{font-size:16pt;margin:0 0 2px}
  #print .pm{font-size:9.5pt;color:#444;margin-bottom:10px}
  #print h2{font-size:13pt;margin:10px 0 6px}
  #print table{border-collapse:collapse;width:100%;font:9.5pt/1.3 Arial,sans-serif}
  #print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left}
  #print th{background:#eee}
  #print td.r,#print th.r{text-align:right}

}

<script>
/* ===== Chess Tournament Manager — engine (pairing, scoring, tie-breaks, export) ===== */
const Engine = (() => {
  const RES = {
    '1-0': { w: 1, b: 0, played: true },
    '0-1': { w: 0, b: 1, played: true },
    '1/2': { w: 0.5, b: 0.5, played: true },
    '+-': { w: 1, b: 0, played: false },
    '-+': { w: 0, b: 1, played: false },
    '--': { w: 0, b: 0, played: false },
  };
  const RES_LABEL = { '1-0': '1 – 0', '0-1': '0 – 1', '1/2': '½ – ½', '+-': '+ / −', '-+': '− / +', '--': '− / −', '': '…', BYE: 'bye' };

  const TIEBREAKS = {
    bhc1: { short: 'BH-C1', name: 'Buchholz Cut 1' },
    bh: { short: 'BH', name: 'Buchholz' },
    bhm: { short: 'BH-M', name: 'Median Buchholz' },
    sb: { short: 'SB', name: 'Sonneborn-Berger' },
    de: { short: 'DE', name: 'Direct encounter' },
    win: { short: 'WIN', name: 'Number of wins' },
    bpg: { short: 'BPG', name: 'Games with black' },
    ps: { short: 'PS', name: 'Progressive score' },
    aro: { short: 'ARO', name: 'Avg. rating of opponents' },
    mp: { short: 'MP', name: 'Match points' },
    gp: { short: 'GP', name: 'Game points' },
  };

  const fmt = (x) => {
    if (x == null) return '';
    const r = Math.round(x * 100) / 100;
    if (Number.isInteger(r)) return String(r);
    if (Math.abs(r * 2 - Math.round(r * 2)) < 1e-9) {
      const whole = Math.floor(r);
      return (whole ? whole : '') + '½';
    }
    return r.toFixed(2).replace(/0$/, '');
  };

  /* Seeding: rating desc, then name */
  function seeded(t) {
    return [...t.players].sort((a, b) => (b.rating || 0) - (a.rating || 0) || a.name.localeCompare(b.name));
  }
  function seedMap(t) {
    const m = {};
    const order = t.type === 'rr' && t.rrOrder ? t.rrOrder.map((id) => t.players.find((p) => p.id === id)).filter(Boolean) : [];
    const rest = seeded(t).filter((p) => !order.includes(p));
    [...order, ...rest].forEach((p, i) => (m[p.id] = i + 1));
    return m;
  }

  /* Per-player, per-round history. upto = number of rounds to include */
  function history(t, upto) {
    const n = upto == null ? t.rounds.length : upto;
    const H = {};
    t.players.forEach((p) => (H[p.id] = []));
    for (let r = 0; r < n; r++) {
      const rd = t.rounds[r];
      const seen = new Set();
      rd.games.forEach((g) => {
        if (g.b == null) {
          if (H[g.w]) H[g.w][r] = { r, opp: null, color: null, pts: t.byePoints ?? 1, gp: t.byeGP ?? null, played: false, type: 'bye' };
          seen.add(g.w);
          return;
        }
        const res = RES[g.r];
        const pending = !g.r;
        const mk = (id, opp, color) => ({
          r, opp, color: res && res.played ? color : (pending ? color : null), scheduledColor: color,
          pts: g.sw != null && res ? (color === 'w' ? g.sw : g.sb) : res ? res[color] : 0,
          rp: res ? res[color] : 0, gp: g.gw != null ? (color === 'w' ? g.gw : g.gb) : null,
          played: !!(res && res.played), pending,
          type: pending ? 'pending' : res.played ? 'game' : res[color] ? 'fwin' : 'floss',
        });
        if (H[g.w]) H[g.w][r] = mk(g.w, g.b, 'w');
        if (H[g.b]) H[g.b][r] = mk(g.b, g.w, 'b');
        seen.add(g.w); seen.add(g.b);
      });
      (rd.half || []).forEach((id) => { if (H[id] && !seen.has(id)) { H[id][r] = { r, opp: null, color: null, pts: 0.5, played: false, type: 'half' }; seen.add(id); } });
      t.players.forEach((p) => { if (!seen.has(p.id)) H[p.id][r] = { r, opp: null, color: null, pts: 0, played: false, type: 'absent' }; });
    }
    return H;
  }

  function scores(t, H) {
    const S = {};
    for (const id in H) S[id] = H[id].reduce((s, e) => s + (e ? e.pts : 0), 0);
    return S;
  }

  /* ---------- Standings ---------- */
  function standings(t, upto) {
    const H = history(t, upto);
    const S = scores(t, H);
    const byId = Object.fromEntries(t.players.map((p) => [p.id, p]));
    const tbs = t.tiebreaks || [];
    const rows = t.players.map((p) => {
      const h = H[p.id];
      const own = S[p.id];
      const contrib = h.map((e) => (e && e.played ? S[e.opp] : own));
      const sorted = [...contrib].sort((a, b) => a - b);
      const sum = (a) => a.reduce((s, x) => s + x, 0);
      let ps = 0, run = 0;
      h.forEach((e) => { run += e ? e.pts : 0; ps += run; });
      const opps = h.filter((e) => e && e.played).map((e) => byId[e.opp]);
      const rated = opps.filter((o) => o && o.rating);
      const tb = {
        bh: sum(contrib),
        bhc1: sum(sorted.slice(1)),
        bhm: sum(sorted.slice(1, -1)),
        sb: h.reduce((s, e) => s + (!e ? 0 : e.played ? e.pts * S[e.opp] : e.pts * own), 0),

/* ---------- routing ---------- */
const view = { tid: null, tab: 'players', round: null, edit: null, stand: 'table', upto: null, q: '' };
const T = () => DB.tournaments.find((t) => t.id === view.tid);

function parseHash() {
  const m = location.hash.match(/^#\/t\/([^/]+)(?:\/(\w+))?/);
  if (m && DB.tournaments.some((t) => t.id === m[1])) {
    if (view.tid !== m[1]) { view.round = null; view.edit = null; view.upto = null; view.q = ''; }
    view.tid = m[1]; view.tab = m[2] || 'players';
  } else { view.tid = null; }
}
function go(hash, replace) {
  if (replace) { history.replaceState(null, '', hash); onRoute(); }
  else location.hash = hash;
}
function onRoute() { closeSheet(true); parseHash(); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', onRoute);

/* ---------- small UI helpers ---------- */
let toastTimer;
function toast(msg) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}
function ask(title, msg, ok = 'OK', danger = false) {
  return new Promise((res) => {
    const d = document.createElement('div');
    d.className = 'dialog';
    d.innerHTML = `<div class="box" role="dialog"><h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="acts">
      <button class="btn" data-x="0">Cancel</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-x="1">${esc(ok)}</button></div></div>`;
    d.addEventListener('click', (e) => {
      const b = e.target.closest('[data-x]');
      if (b || e.target === d) { d.remove(); res(b ? b.dataset.x === '1' : false); }
    });
    document.body.appendChild(d);
  });
}

let sheetEls = null;
function openSheet(title, body, footer, onMount) {
  closeSheet(true);
  const ov = document.createElement('div'); ov.className = 'overlay';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="grab"></div><header><h3>${esc(title)}</h3><button class="icon-btn" data-act="closeSheet" aria-label="Close">${I.close}</button></header>
    <div class="body">${body}</div>${footer ? `<footer>${footer}</footer>` : ''}`;
  ov.addEventListener('click', () => closeSheet());
  document.body.append(ov, sh);
  sheetEls = [ov, sh];
  requestAnimationFrame(() => { ov.classList.add('show'); sh.classList.add('show'); });
  if (onMount) onMount(sh);
  return sh;
}
function closeSheet(instant) {
  if (!sheetEls) return;
  const [ov, sh] = sheetEls; sheetEls = null;
  if (instant) { ov.remove(); sh.remove(); return; }
  ov.classList.remove('show'); sh.classList.remove('show');
  setTimeout(() => { ov.remove(); sh.remove(); }, 230);
}
function setSheetBody(html) { if (sheetEls) $('.body', sheetEls[1]).innerHTML = html; }

function download(name, text, mime = 'text/plain') {
  try {
    const blob = new Blob([text], { type: mime + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Saved ' + name);
  } catch (e) {
    openSheet(name, `<p class="hint">Download isn't available here. Copy the text below:</p><textarea readonly style="min-height:300px">${esc(text)}</textarea>`);
  }
}
const safeName = (s) => (s || 'tournament').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_').slice(0, 40) || 'tournament';

/* ---------- tournament helpers ---------- */
function newTournament() {
  return {
    id: uid(), name: '', date: new Date().toISOString().slice(0, 10), venue: '', arbiter: '', type: 'swiss', numRounds: 5, roundsMode: 'sqrt',
    double: false, byePoints: 1, topWhite: true, tiebreaks: ['bhc1', 'bh', 'sb', 'de', 'win'], players: [], rounds: [], created: Date.now(),
    mode: 'individual', boards: 4, teamScoring: 'mp', teams: [],
  };
}
const defaultTB = (type, mode, scoring) => mode === 'team'
  ? (scoring === 'gp' ? ['mp', 'de', 'bh', 'sb'] : ['gp', 'de', 'bh', 'sb']).filter((k) => type !== 'rr' || k !== 'bh')
  : (type === 'rr' ? ['de', 'sb', 'win'] : ['bhc1', 'bh', 'sb', 'de', 'win']);
const isTeam = (t) => !!t && t.mode === 'team';
const V = (t) => (isTeam(t) ? E.teamView(t) : t);
const ents = (t) => (isTeam(t) ? (t.teams || []) : t.players);
const noun = (t, n) => (isTeam(t) ? (n === 1 ? 'team' : 'teams') : (n === 1 ? 'player' : 'players'));
const pById = (t, id) => ents(t).find((p) => p.id === id);
const memberById = (t, id) => { for (const tm of t.teams || []) { const m = (tm.members || []).find((x) => x.id === id); if (m) return m; } return null; };
const gDone = (g) => g.b == null || (g.boards ? g.boards.every((x) => x.r) : !!g.r);
const roundDone = (rd) => rd.games.every(gDone);
const resultsCount = (rd) => { const real = rd.games.filter((g) => g.b != null); return [real.filter(gDone).length, real.length]; };
const standFor = (t, upto) => (isTeam(t) ? E.teamStandings(t, upto) : E.standings(t, upto));
const ptsLabel = (t) => (isTeam(t) ? (t.teamScoring === 'gp' ? 'GP' : 'MP') : 'Pts');
const allowedTB = (d) => Object.keys(E.TIEBREAKS).filter((k) => d.mode === 'team' ? k !== (d.teamScoring === 'gp' ? 'gp' : 'mp') && k !== 'bpg' : k !== 'mp' && k !== 'gp');
function statusLine(t) {
  const total = E.totalRounds(V(t));
  const n = t.rounds.length;
  const type = (isTeam(t) ? 'Team ' : '') + (t.type === 'rr' ? (t.double ? 'double round robin' : 'round robin') : 'Swiss');
  let st;
  if (!n) st = 'Not started';
  else if (n >= total && roundDone(t.rounds[n - 1])) st = 'Finished';
  else st = `Round ${n} of ${total}`;
  const cnt = ents(t).length;
  return `${type.charAt(0).toUpperCase() + type.slice(1)} · ${cnt} ${noun(t, cnt)} · ${st}`;
}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  const t = T();
  if (!t) { app.innerHTML = renderHome(); document.body.className = 'home'; return; }
  document.body.className = '';
  const tabs = [['players', isTeam(t) ? 'Teams' : 'Players', I.people], ['rounds', 'Rounds', I.board], ['standings', 'Standings', I.trophy], ['more', 'More', I.gear]];
  let content = '';
  if (view.tab === 'rounds') content = renderRounds(t);
  else if (view.tab === 'standings') content = renderStandings(t);
  else if (view.tab === 'more') content = renderMore(t);
  else content = isTeam(t) ? renderTeams(t) : renderPlayers(t);
  app.innerHTML = `
    <div class="top"><button class="icon-btn" data-act="home" aria-label="Back">${I.back}</button>
      <div class="titles"><h1>${esc(t.name || 'Untitled')}</h1><div class="sub">${esc(statusLine(t))}</div></div></div>
    ${content}
    <nav class="tabs"><div class="in">${tabs.map(([k, l, ic]) => `<button class="${view.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${ic}<span>${l}</span></button>`).join('')}</div></nav>`;
}

/* ----- players ----- */
function playerRows(t) {
  const seeds = E.seedMap(t);
  const S = E.scores(t, E.history(t));
  const q = view.q.trim().toLowerCase();
  const ps = [...t.players].sort((a, b) => seeds[a.id] - seeds[b.id])
    .filter((p) => !q || (p.name + ' ' + (p.club || '')).toLowerCase().includes(q));
  return ps.map((p) => `<button class="row" data-act="editP" data-id="${p.id}">
      <span class="seed num">${seeds[p.id]}</span>
      <span class="main"><span class="name">${esc(p.name)} ${p.status === 'withdrawn' ? '<span class="tag warn">withdrawn</span>' : ''}</span>
      <span class="meta">${esc([p.rating ? p.rating : 'unrated', p.club].filter(Boolean).join(' · '))}</span></span>
      ${t.rounds.length ? `<span class="pts num">${fmt(S[p.id])}</span>` : ''}</button>`).join('') || '<div class="empty">No match</div>';
}
function renderPlayers(t) {
  return `<div class="wrap">
    <div class="toolbar"><input type="search" id="psearch" class="grow" placeholder="Search ${t.players.length} players" value="${esc(view.q)}" data-input="search">
      <button class="btn" data-act="bulk">Bulk add</button></div>
    ${t.type === 'rr' && t.rrOrder ? '<div class="note">Round robin schedule is fixed. New players won\'t be added to it unless you delete all rounds.</div>' : ''}
    ${t.players.length ? `<div class="list" id="plist">${playerRows(t)}</div>
      <p class="hint">Numbers are pairing numbers (sorted by rating). Tap a player to edit or withdraw.</p>`
      : `<div class="empty"><div class="big">♟</div><h3>Add players</h3><p>Add them one by one, or paste a list with Bulk add.</p></div>`}
  </div>
  <button class="btn primary fab" data-act="addP">${I.plus} Player</button>`;
}

function playerSheet(t, p) {
  const isNew = !p;
  p = p || { name: '', rating: '', club: '', sex: '', fed: '', fideId: '', title: '', status: 'active' };
  const inRounds = !isNew && t.rounds.some((rd) => rd.games.some((g) => g.w === p.id || g.b === p.id) || (rd.half || []).includes(p.id));
  const body = `
    <label class="f"><span>Name</span><input type="text" id="p_name" value="${esc(p.name)}" autocomplete="off" placeholder="Last, First"></label>
    <div class="grid2">
      <label class="f"><span>Rating</span><input type="number" id="p_rating" inputmode="numeric" value="${esc(p.rating)}" placeholder="0"></label>
      <label class="f"><span>Sex</span><select id="p_sex"><option value="">—</option><option ${p.sex === 'm' ? 'selected' : ''} value="m">Male</option><option ${p.sex === 'f' ? 'selected' : ''} value="f">Female</option></select></label>
    </div>
    <label class="f"><span>School / club</span><input type="text" id="p_club" value="${esc(p.club)}"></label>
    <div class="grid2">
      <label class="f"><span>Federation</span><input type="text" id="p_fed" maxlength="3" value="${esc(p.fed)}" placeholder="PHI"></label>
      <label class="f"><span>FIDE ID</span><input type="text" id="p_fide" inputmode="numeric" value="${esc(p.fideId)}"></label>
    </div>
    ${isNew ? '' : `<label class="f"><span>Status</span><div class="seg" id="p_status">
      <button type="button" class="${p.status !== 'withdrawn' ? 'on' : ''}" data-act="segPick" data-v="active">Active</button>
      <button type="button" class="${p.status === 'withdrawn' ? 'on' : ''}" data-act="segPick" data-v="withdrawn">Withdrawn</button></div>
      <p class="hint">Withdrawn players are left out of future Swiss pairings.</p></label>
      ${inRounds ? '' : `<button class="btn danger block" data-act="delP" data-id="${p.id}">${I.trash} Delete player</button>`}`}
  `;
  openSheet(isNew ? 'Add player' : 'Edit player', body,
    `${isNew ? '<button class="btn" data-act="saveP" data-more="1">Save & add another</button>' : ''}<button class="btn primary" data-act="saveP" data-id="${isNew ? '' : p.id}">Save</button>`,
    (sh) => { if (isNew) setTimeout(() => $('#p_name', sh).focus(), 250); });
}

/* ----- rounds ----- */
function renderRounds(t) {
  const n = t.rounds.length;
  const total = E.totalRounds(V(t));
  if (view.round == null || view.round >= n) view.round = n - 1;
  if (view.edit) return renderEdit(t);
  if (!n) {
    return `<div class="wrap"><div class="empty"><div class="big">♜</div><h3>Ready to pair round 1?</h3>
      <p>${ents(t).length < 2 ? `Add at least two ${noun(t, 2)} first.` : `${ents(t).filter((p) => p.status !== 'withdrawn').length} active ${noun(t, 2)}. ${t.type === 'rr' ? `The round robin will have ${total} rounds.` : `${total} rounds planned.`}`}</p>
      <button class="btn primary" style="margin-top:12px" data-act="genRound" ${ents(t).length < 2 ? 'disabled' : ''}>Pair round 1</button></div></div>`;
  }
  if (isTeam(t)) return renderTeamRounds(t);
  const ri = view.round;
  const rd = t.rounds[ri];
  const chips = t.rounds.map((r, i) => `<button class="chip ${i === ri ? 'on' : ''} ${roundDone(r) ? 'done' : ''}" data-act="round" data-i="${i}">R${i + 1}</button>`).join('')
    + (n < total ? `<button class="chip add" data-act="genRound">+ R${n + 1}</button>` : '');
  const S = E.scores(t, E.history(t, ri));
  const [done, all] = resultsCount(rd);
  const nameOf = (id) => { const p = pById(t, id); return p ? p.name : '?'; };
  let boardNo = 0;
  const boards = rd.games.map((g, gi) => {
    if (g.b == null) {
      return `<div class="board"><span class="bno">–</span><div class="pl"><span class="nm">${esc(nameOf(g.w))}</span><span class="sc num">${fmt(S[g.w])}</span></div>
        <span class="byeline">bye +${fmt(t.byePoints ?? 1)}</span></div>`;
    }
    boardNo++;
    const r = g.r;
    const cls = !r ? 'pending' : r === '1-0' ? 'win-w' : r === '0-1' ? 'win-b' : r === '1/2' ? 'draw' : 'ff';
    const ws = r ? (E.RES[r].w === 1 ? 'won' : E.RES[r].w === 0 ? 'lost' : '') : '';
    const bs = r ? (E.RES[r].b === 1 ? 'won' : E.RES[r].b === 0 ? 'lost' : '') : '';
    return `<div class="board"><span class="bno num">${boardNo}</span>
      <div><div class="pl ${ws}"><span class="pc w"></span><span class="nm">${esc(nameOf(g.w))}</span><span class="sc num">${fmt(S[g.w])}</span></div>
      <div class="pl ${bs}"><span class="pc b"></span><span class="nm">${esc(nameOf(g.b))}</span><span class="sc num">${fmt(S[g.b])}</span></div></div>
      <button class="res ${cls} num" data-act="res" data-g="${gi}">${r ? E.RES_LABEL[r] : 'Result'}</button></div>`;
  }).join('');
  const onBoard = new Set(rd.games.flatMap((g) => [g.w, g.b]));
  const half = (rd.half || []).filter((id) => !onBoard.has(id));
  const absent = t.players.filter((p) => !onBoard.has(p.id) && !half.includes(p.id));
  const isLast = ri === n - 1;
  const finished = n >= total && roundDone(t.rounds[n - 1]);
  return `<div class="wrap">
    <div class="chips">${chips}</div>
    <div class="rhead"><div style="flex:1"><h2>Round ${ri + 1}</h2><div class="meta num">${done} of ${all} results in</div></div>
      <button class="icon-btn" data-act="printRound" aria-label="Print">${I.print}</button>
      <button class="icon-btn" data-act="roundMenu" aria-label="Round options">${I.more}</button></div>
    <div class="list">${boards}</div>
    ${half.length || absent.length ? `<div class="note">${half.length ? `<b>½-point bye:</b> ${half.map((id) => esc(nameOf(id))).join(', ')}<br>` : ''}${absent.length ? `<b>Not paired:</b> ${absent.map((p) => esc(p.name)).join(', ')}` : ''}</div>` : ''}
    ${isLast && done === all && !finished && n < total ? `<button class="btn primary block" style="margin-top:14px" data-act="genRound">Pair round ${n + 1}</button>` : ''}
    ${finished && isLast ? `<div class="note" style="text-align:center">🏁 All ${total} rounds finished. <a href="#/t/${t.id}/standings">See final standings</a></div>` : ''}
  </div>`;
}

function resultSheet(t, gi) {
  const rd = t.rounds[view.round];
  const g = rd.games[gi];
  const w = pById(t, g.w), b = pById(t, g.b);
  const btn = (v, label) => `<button class="${g.r === v ? 'on' : ''}" data-act="setRes" data-g="${gi}" data-v="${v}">${label}</button>`;
  openSheet(`Board ${rd.games.slice(0, gi + 1).filter((x) => x.b != null).length}`, `
    <div class="vs"><div class="p"><span class="pc w"></span> ${esc(w?.name)}<small>${w?.rating || ''}</small></div><div class="v">vs</div>
      <div class="p"><span class="pc b"></span> ${esc(b?.name)}<small>${b?.rating || ''}</small></div></div>
    <div class="resgrid">${btn('1-0', '1 – 0')}${btn('1/2', '½ – ½')}${btn('0-1', '0 – 1')}</div>
    <div class="section-title" style="margin-top:14px">Forfeits</div>
    <div class="resgrid small">${btn('+-', '+ / −')}${btn('--', '− / −')}${btn('-+', '− / +')}</div>
    <p class="hint">+ / − means White wins by forfeit. Forfeits don't count as played games for colours and tie-breaks.</p>
    ${g.r ? `<button class="btn block" style="margin-top:12px" data-act="setRes" data-g="${gi}" data-v="">Clear result</button>` : ''}`);
}

function generateSheet(t) {
  const n = t.rounds.length;
  if (n && !roundDone(t.rounds[n - 1])) {
    const [d, a] = resultsCount(t.rounds[n - 1]);
    openSheet(`Round ${n + 1}`, `<div class="note warn">Round ${n} still needs ${a - d} result${a - d === 1 ? '' : 's'}. Enter all results first so scores are right for the pairing.</div>`,
      `<button class="btn primary" data-act="closeSheet">OK</button>`);
    return;
  }
  if (t.type === 'rr') {
    if (!t.rrOrder) {
      const active = ents(t).filter((p) => p.status !== 'withdrawn');
      openSheet('Start round robin', `
        <p>${active.length} ${noun(t, active.length)} · ${E.totalRounds({ ...V(t), rrOrder: active.map((p) => p.id) })} rounds${t.double ? ' (double)' : ''}.</p>
        <label class="f"><span>Draw order</span><div class="seg" id="rr_order">
          <button class="on" data-act="segPick" data-v="rating">By rating</button><button data-act="segPick" data-v="random">Random draw</button></div></label>
        <p class="hint">The full schedule is fixed once you start. Players added later won't be included.</p>`,
        `<button class="btn primary" data-act="doGen">Pair round 1</button>`);
    } else {
      doGenerate(t, {});
    }
    return;
  }
  const status = {};
  ents(t).forEach((p) => (status[p.id] = p.status === 'withdrawn' ? 'out' : 'play'));
  view.gen = status;
  const rows = () => [...ents(t)].sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<div class="statusrow"><span class="nm">${esc(p.name)} ${p.status === 'withdrawn' ? '<span class="tag warn">wd</span>' : ''}</span>
    <div class="seg mini">${[['play', 'Play'], ['half', '½ bye'], ['out', 'Out']].filter((o) => !isTeam(t) || o[0] !== 'half').map(([v, l]) => `<button class="${view.gen[p.id] === v ? 'on' : ''}" data-act="genSt" data-id="${p.id}" data-v="${v}">${l}</button>`).join('')}</div></div>`).join('');
  view.genRows = rows;
  const count = () => Object.values(view.gen).filter((v) => v === 'play').length;
  openSheet(`Pair round ${n + 1}`, `<p class="hint" style="margin-bottom:10px" id="gen_count">${genCountText(t, count())}</p>
    <div class="list" id="gen_list">${rows()}</div>`,
    `<button class="btn primary" data-act="doGen">Pair round ${n + 1}</button>`);
}

function doGenerate(t, opts) {
  const n = t.rounds.length;
  try {
    if (t.type === 'rr') {
      if (!t.rrOrder) {
        let ids = E.seeded(V(t)).filter((p) => p.status !== 'withdrawn').map((p) => p.id);
        if (opts.random) for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
        if (ids.length < 2) throw new Error(`Need at least 2 active ${noun(t, 2)}.`);
        t.rrOrder = ids;
      }
      const sch = E.rrSchedule(t.rrOrder, t.double);
      if (n >= sch.length) throw new Error('All rounds are already paired.');
      t.rounds.push({ games: isTeam(t) ? sch[n].map((g) => E.makeMatch(t, g)) : clone(sch[n]), half: [] });
    } else {
      const playing = Object.keys(view.gen).filter((id) => view.gen[id] === 'play');
      const half = isTeam(t) ? [] : Object.keys(view.gen).filter((id) => view.gen[id] === 'half');
      if (playing.length < 2) throw new Error(`Need at least 2 ${noun(t, 2)} to pair.`);
      let games = E.pairSwiss(V(t), { playing });
      const met = new Set(t.rounds.flatMap((rd) => rd.games.filter((g) => g.b != null).map((g) => [g.w, g.b].sort().join())));
      view.rematch = games.some((g) => g.b != null && met.has([g.w, g.b].sort().join()));
      if (isTeam(t)) games = games.map((g) => E.makeMatch(t, g));
      t.rounds.push({ games, half });
    }
    save(); closeSheet(); view.round = t.rounds.length - 1;
    go(`#/t/${t.id}/rounds`, true);
    toast(view.rematch ? `Round ${t.rounds.length} paired — some ${noun(t, 2)} had to meet again (too many rounds for this field)` : `Round ${t.rounds.length} paired`);
    view.rematch = false;
  } catch (e) { toast(e.message || 'Pairing failed'); }
}

/* edit pairings */

  const rd = t.rounds[view.round];
  view.edit = { games: clone(rd.games), half: clone(rd.half || []) };
  render();
}

    ${isTeam(t) && unpaired.length ? `<div class="note"><b>Not paired:</b> ${unpaired.map((p) => esc(p.name)).join(', ')}</div>` : ''}
    ${!isTeam(t) && unpaired.length ? `<div class="section-title">Not paired this round</div><div class="list">${unpaired.map((p) => `<div class="statusrow"><span class="nm">${esc(p.name)}</span>
      <div class="seg mini"><button class="${d.half.includes(p.id) ? '' : 'on'}" data-act="edHalf" data-id="${p.id}" data-v="0">Absent</button><button class="${d.half.includes(p.id) ? 'on' : ''}" data-act="edHalf" data-id="${p.id}" data-v="1">½ bye</button></div></div>`).join('')}</div>` : ''}
    <p class="hint">${isTeam(t) ? 'Changing a team resets that match\'s line-up and results.' : 'Changing a player on a board clears that board\'s result.'}</p>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1" data-act="edCancel">Cancel</button>
      <button class="btn primary" style="flex:2" data-act="edSave" ${dup.length ? 'disabled' : ''}>Save pairings</button></div>

/* ----- standings ----- */
function renderStandings(t) {
  const n = t.rounds.length;
  if (!n) return `<div class="wrap"><div class="empty"><div class="big">♛</div><h3>No standings yet</h3><p>Standings appear after round 1 is paired.</p></div></div>`;
  const upto = view.upto == null || view.upto > n ? n : view.upto;
  const rows = standFor(t, upto);
  const tbs = t.tiebreaks || [];
  const team = isTeam(t);
  const upSel = `<select data-change="upto" style="width:auto;height:36px">${t.rounds.map((_, i) => `<option value="${i + 1}" ${i + 1 === upto ? 'selected' : ''}>After round ${i + 1}</option>`).join('')}</select>`;
  let table;
  if (view.stand === 'boards' && team) {
    const bs = E.boardStats(t, upto);
    table = bs.length ? `<table class="st num"><thead><tr><th class="l stick">#</th><th class="l">Player</th><th>Pts</th><th>Games</th><th>%</th><th>Rtg</th></tr></thead><tbody>
      ${bs.map((r, i) => `<tr class="${i < 3 ? 'top3' : ''}"><td class="l stick">${i + 1}</td><td class="l nm">${esc(r.name)}<small>${esc(r.team.name)} · bd ${[...new Set(r.boards)].sort((a, b) => a - b).join(',')}</small></td><td class="b">${fmt(r.pts)}</td><td>${r.games}</td><td>${r.pct}</td><td>${r.rating || ''}</td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">No board results yet</div>';
  } else if (view.stand === 'cross') {
    const rankOf = Object.fromEntries(rows.map((r) => [r.id, r.rank]));
    const posOf = Object.fromEntries(rows.map((r, i) => [r.id, i + 1]));
    table = `<table class="st num"><thead><tr><th class="l stick">#</th><th class="l">${team ? 'Team' : 'Name'}</th>${Array.from({ length: upto }, (_, i) => `<th>R${i + 1}</th>`).join('')}<th>${ptsLabel(t)}</th></tr></thead><tbody>
      ${rows.map((r) => `<tr><td class="l stick">${r.rank}</td><td class="l nm">${esc(r.player.name)}</td>${r.hist.slice(0, upto).map((e) => `<td class="x">${crossCell(e, posOf, team)}</td>`).join('')}<td class="b">${fmt(r.pts)}</td></tr>`).join('')}
      </tbody></table>`;
  } else {
    table = `<table class="st num"><thead><tr><th class="l stick">#</th><th class="l">${team ? 'Team' : 'Name'}</th><th>${ptsLabel(t)}</th>${tbs.map((k) => `<th title="${esc(E.TIEBREAKS[k].name)}">${E.TIEBREAKS[k].short}</th>`).join('')}<th>Rtg</th></tr></thead><tbody>
      ${rows.map((r) => `<tr class="${r.rank <= 3 ? 'top3' : ''}"><td class="l stick">${r.rank}</td><td class="l nm">${esc(r.player.name)}${r.player.club ? `<small>${esc(r.player.club)}</small>` : ''}</td>
        <td class="b">${fmt(r.pts)}</td>${tbs.map((k) => `<td>${fmt(r.tb[k])}</td>`).join('')}<td>${r.player.rating || ''}</td></tr>`).join('')}
      </tbody></table>`;
  }
  const pending = t.rounds.slice(0, upto).some((rd) => !roundDone(rd));
  return `<div class="wrap">
    <div class="toolbar"><div class="seg grow"><button class="${view.stand !== 'cross' && view.stand !== 'boards' ? 'on' : ''}" data-act="stand" data-v="table">Standings</button><button class="${view.stand === 'cross' ? 'on' : ''}" data-act="stand" data-v="cross">Crosstable</button>${team ? `<button class="${view.stand === 'boards' ? 'on' : ''}" data-act="stand" data-v="boards">Players</button>` : ''}</div></div>
    <div class="toolbar">${upSel}<span class="grow"></span>
      <button class="btn sm" data-act="printStand">${I.print} Print</button><button class="btn sm" data-act="csvStand">${I.down} CSV</button></div>
    ${pending ? '<div class="note">Some results are still missing — standings are provisional.</div>' : ''}
    <div class="tablewrap">${table}</div>
    ${view.stand === 'boards' ? '<p class="hint">Individual board scores. Forfeit wins count as a game.</p>' : view.stand === 'cross' ? `<p class="hint">Each cell: opponent's place, colour on board 1 (w/b), ${team ? 'game points' : 'result'}.</p>` : `<p class="hint">${tbs.map((k) => `${E.TIEBREAKS[k].short} = ${E.TIEBREAKS[k].name}`).join(' · ')}</p>`}
  </div>`;
}
function crossCell(e, posOf, team) {
  if (!e) return '';
  if (team && e.type !== 'bye' && e.type !== 'absent' && e.opp) return `${posOf[e.opp] || '?'}${e.scheduledColor} <b>${e.pending ? '?' : fmt(e.gp)}</b>`;
  if (e.type === 'bye') return '<b>+</b> bye';
  if (e.type === 'half') return '<b>½</b> bye';
  if (e.type === 'absent') return '—';
  const res = e.type === 'pending' ? '?' : e.type === 'fwin' ? '+' : e.type === 'floss' ? '−' : e.pts === 1 ? '1' : e.pts === 0 ? '0' : '½';
  return `${posOf[e.opp] || '?'}${e.scheduledColor} <b>${res}</b>`;
}

}

function importData(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return toast('That file is not a valid backup'); }
  const list = Array.isArray(obj?.tournaments) ? obj.tournaments : obj && Array.isArray(obj.players) && Array.isArray(obj.rounds) ? [obj] : null;
  if (!list) return toast('That file is not a valid backup');
  let added = 0;
  list.forEach((t) => {
    if (!t || !Array.isArray(t.players) || !Array.isArray(t.rounds)) return;
    const copy = clone(t);
    if (DB.tournaments.some((x) => x.id === copy.id)) { copy.id = uid(); copy.name = (copy.name || 'Untitled') + ' (imported)'; }
    copy.created = copy.created || Date.now();
    DB.tournaments.push(copy); added++;
  });
  save(); render(); toast(`Imported ${added} tournament${added === 1 ? '' : 's'}`);
}

function parseMemberLine(line) {
  line = line.trim(); if (!line) return null;
  const tail = !line.includes('\t') && line.match(/^(.*?[^\s,])\s+(\d{3,4})$/);
  if (tail) line = tail[1] + ', ' + tail[2];
  let parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map((s) => s.trim()).filter(Boolean);
  let rating = 0;
  const ri = parts.findIndex((s, i) => i > 0 && /^\d{3,4}$/.test(s));
  if (ri > 0) { rating = +parts[ri]; parts = parts.slice(0, ri); }
  const name = parts.join(', ');
  return name ? { name, rating } : null;
}

function applyRoster(t, tm, text) {
  const old = tm.members || [];
  const used = new Set();
  const members = [];
  text.split(/\r?\n/).forEach((line, i) => {
    const pm = parseMemberLine(line); if (!pm) return;
    const ex = old.find((m) => !used.has(m.id) && m.name.toLowerCase() === pm.name.toLowerCase());
    const id = ex ? ex.id : uid() + i;
    used.add(id);
    members.push({ id, name: pm.name, rating: pm.rating || (ex ? ex.rating : 0) });
  });
  old.forEach((m) => { if (!used.has(m.id) && memberInRounds(t, m.id)) members.push({ ...m, removed: true }); });
  tm.members = members;
}

      if (!w && !b) continue;
      if (!w) { w = b; b = ''; g.boards = null; }
      if (!b) games.push({ w, b: null, r: 'BYE' });
      else if (isTeam(t)) games.push(g.boards ? { w, b, boards: g.boards } : E.makeMatch(t, { w, b }));
      else games.push({ w, b, r: r === 'BYE' ? '' : r || '' });
    }
    const real = games.filter((g) => g.b != null), byes = games.filter((g) => g.b == null);
    const onBoard = new Set(games.flatMap((g) => [g.w, g.b]));
    t.rounds[view.round].games = [...real, ...byes];
    t.rounds[view.round].half = d.half.filter((id) => !onBoard.has(id));
    view.edit = null; save(); render(); toast('Pairings saved');
  },
};
const CHANGE = {
  edSel: (el) => { const g = view.edit.games[+el.dataset.i]; g[el.dataset.side] = el.value; g.r = ''; if (g.boards) g.boards = null; render(); },
  upto: (el) => { view.upto = +el.value; render(); },
  tscore: (el) => {
    const d = view.setDraft; readSettingsInto(d); d.teamScoring = el.value;
    d.tiebreaks = defaultTB(d.type, d.mode, d.teamScoring); buildTbDraft(d); $('#s_tb').innerHTML = tbList();
  },
  mbSel: (el) => { const b = view.mdraft.boards[+el.dataset.i]; b[el.dataset.side] = el.value; if (!b.a || !b.b) b.r = !b.a && !b.b ? '--' : !b.a ? '-+' : '+-'; else if (['--', '-+', '+-'].includes(b.r)) b.r = ''; rerenderMatch(); },
  rmode: (el) => {
    const d = view.setDraft; d.roundsMode = el.value;
    const inp = $('#s_rounds');
    if (el.value === 'manual') { inp.disabled = false; inp.value = d.numRounds || E.totalRounds({ ...d, roundsMode: 'sqrt' }); inp.focus(); }
    else { inp.disabled = true; inp.value = E.totalRounds(V(d)); }
    $('#s_rhint').textContent = roundsHint(d, el.value);
  },
  tbOn: (el) => { view.tbDraft[+el.dataset.i].on = el.checked; $('#s_tb').innerHTML = tbList(); },
};
function readSettingsInto(d) {
  d.name = $('#s_name').value.trim(); d.date = $('#s_date').value; d.venue = $('#s_venue').value.trim(); d.arbiter = $('#s_arb').value.trim();
  d.byePoints = parseFloat($('#s_bye').value);
  const rm = $('#s_rmode'); if (rm) d.roundsMode = rm.value;
  const md = $('#s_mode .on'); if (md) d.mode = md.dataset.v;
  const bd = $('#s_boards'); if (bd) d.boards = Math.max(1, Math.min(12, parseInt(bd.value, 10) || 4));
  const ts = $('#s_tscore'); if (ts) d.teamScoring = ts.value;
  const r = $('#s_rounds'); if (r && (!rm || rm.value === 'manual')) d.numRounds = Math.max(1, Math.min(30, parseInt(r.value, 10) || 5));
  const tw = $('#s_topw'); if (tw) d.topWhite = tw.value === '1';
  const db = $('#s_double'); if (db) d.double = db.checked;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 's_rounds' && view.setDraft) { view.setDraft.numRounds = parseInt(e.target.value, 10) || 0; const h = $('#s_rhint'); const m = $('#s_rmode'); if (h && m) h.textContent = roundsHint(view.setDraft, m.value); }
  if (e.target.dataset.input === 'search') { view.q = e.target.value; const l = $('#plist'); if (l) l.innerHTML = playerRows(T()); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.closest('.sheet')) {
    const more = $('[data-act="saveP"][data-more]'); if (more) { e.preventDefault(); more.click(); }
  }
  if (e.key === 'Escape') closeSheet();
});
window.addEventListener('scroll', () => { const top = $('.top'); if (top) top.classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
$('#importFile').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => importData(rd.result); rd.readAsText(f); e.target.value = '';
});

try { const th = localStorage.getItem('ctm-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
load(); parseHash(); render();
window.__ctm = { DB: () => DB, view };
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
